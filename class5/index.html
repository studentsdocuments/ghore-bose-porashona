<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>৫ম শ্রেণি — অধ্যায়ভিত্তিক প্রশ্ন | ঘরে বসে পড়াশোনা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F3864;--g:#16a34a;--gb:#e8f6ed;--bad:#b3261e;--badb:#fdecea;--line:#d5dcec;--bg:#f4f6fb;--mut:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1e293b;font:16px/1.65 "Hind Siliguri","Nirmala UI","Noto Sans Bengali",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:12px 14px 40px}
.top{background:var(--ink);color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:18px}.top small{opacity:.85}
.top a.back{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#fff;text-decoration:none;font-size:14px;background:#ffffff22;padding:4px 10px;border-radius:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.ch{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer}
.ch .no{flex:0 0 40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.ch .t{flex:1;font-weight:600}.ch .c{font-size:13px;color:var(--mut)}
.ch:hover{background:#f8faff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 6px;font-size:14px}
.btn{border:0;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
.btn.g{background:#e2e8f0;color:#1e293b}
.q{padding:12px 0;border-bottom:1px dashed var(--line)}.q:last-child{border:0}
.qn{font-weight:700;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff;text-align:left;font:inherit;cursor:pointer}
.opt.right{background:var(--gb);border-color:var(--g);font-weight:600}.opt.wrong{background:var(--badb);border-color:var(--bad)}
.ans{margin-top:6px;padding:8px 10px;background:var(--gb);border-left:4px solid var(--g);border-radius:6px;white-space:pre-wrap;display:none}
.ans.show{display:block}.ans b{color:#166534}
.sh{display:block;background:none;border:0;color:#2563eb;font:inherit;font-size:14px;cursor:pointer;padding:2px 0}
.exm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.exm span{display:block;text-align:center;padding:12px;border-radius:12px;background:#94a3b8;color:#fff;font-weight:700}
.msg{text-align:center;color:var(--mut);padding:30px 0}
</style></head><body>
<div class="top"><a class="back" id="bk" href="../">← হোম</a><h1 id="h1">৫ম শ্রেণি</h1><small id="h2"></small></div>
<div class="wrap" id="app"><div class="msg">লোড হচ্ছে…</div></div>
<script>
const $=id=>document.getElementById(id),app=$("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const SUBJ={islam:"ইসলাম শিক্ষা",science:"বিজ্ঞান",bgs:"বাংলাদেশ ও বিশ্বপরিচয়"};
const TYPES=[["mcq","বহুনির্বাচনি"],["blank","শূন্যস্থান পূরণ"],["truefalse","সত্য/মিথ্যা"],["match","বাক্যাংশ মিলাও"],["short","সংক্ষিপ্ত প্রশ্ন"],["essay","রচনামূলক"]];
const L=["ক","খ","গ","ঘ"],qs=new URLSearchParams(location.search),sk=SUBJ[qs.get("s")]?qs.get("s"):null;
let D=null,cur=null,ty=null;
function load(k){return new Promise((ok,no)=>{if(window.C5&&C5[k])return ok(C5[k]);const s=document.createElement("script");s.src="data/"+k+".js";s.onload=()=>ok(C5[k]);s.onerror=()=>no();document.head.appendChild(s)})}
function head(a,b,back){$("h1").textContent=a;$("h2").textContent=b||"";$("bk").href=back||"../";$("bk").onclick=null}
function subjects(){head("৫ম শ্রেণি","বিষয় বেছে নাও");app.innerHTML=Object.keys(SUBJ).map(k=>`<a class="card ch" href="?s=${k}"><div class="no">${SUBJ[k][0]}</div><div class="t">${SUBJ[k]}</div></a>`).join("")}
async function open_(){
 if(!sk)return subjects();
 try{D=await load(sk)}catch(e){app.innerHTML='<div class="msg">লোড হয়নি — ইন্টারনেট দেখে আবার চেষ্টা করো।</div>';return}
 const c=+(qs.get("c")||0);c&&D.ch.some(x=>x.no===c)?chapter(c):list()}
function cnt(c){return Object.values(c.q).reduce((t,a)=>t+a.length,0)}
function list(){head(D.t,"অধ্যায় বেছে নাও — ৫ম শ্রেণি","../");history.replaceState(null,"","?s="+sk);
 app.innerHTML=D.ch.map(c=>`<a class="card ch" data-c="${c.no}"><div class="no">${bn(c.no)}</div><div><div class="t">${esc(c.title)}</div><div class="c">মোট ${bn(cnt(c))}টি প্রশ্ন</div></div></a>`).join("")+exams();
 app.querySelectorAll("[data-c]").forEach(a=>a.onclick=()=>chapter(+a.dataset.c))}
const exams=()=>`<div class="exm"><span>🔒 রিয়েল এক্সাম <small>(শীঘ্রই)</small></span><span>✅ OMR <small>(শীঘ্রই)</small></span></div>`;
function chapter(n){cur=D.ch.find(x=>x.no===n);history.replaceState(null,"","?s="+sk+"&c="+n);
 const av=TYPES.filter(t=>cur.q[t[0]]);if(!av.some(t=>t[0]===ty))ty=av[0][0];
 head(D.t,"অধ্যায় "+bn(n)+": "+cur.title,"?s="+sk);$("bk").onclick=e=>{e.preventDefault();list()};
 app.innerHTML=`<div class="tabs">${av.map(t=>`<button class="tab ${t[0]===ty?"on":""}" data-t="${t[0]}">${t[1]} (${bn(cur.q[t[0]].length)})</button>`).join("")}</div>
 <div class="tools"><span>প্রশ্ন বাছাই করে উত্তর দেখো</span><button class="btn g" id="all">সব উত্তর দেখাও</button></div><div class="card" id="qa"></div>`;
 app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ty=b.dataset.t;chapter(n)});
 const qa=$("qa");qa.innerHTML=cur.q[ty].map(q=>item(q,ty)).join("");
 qa.querySelectorAll(".sh").forEach(b=>b.onclick=()=>{const a=b.nextElementSibling;a.classList.toggle("show");b.textContent=a.classList.contains("show")?"উত্তর লুকাও":"উত্তর দেখো"});
 qa.querySelectorAll(".opts").forEach(w=>w.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{w.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong","right"));
  const ok=o.dataset.r==="1";o.classList.add(ok?"right":"wrong");if(!ok)w.querySelector('[data-r="1"]').classList.add("right")}));
 $("all").onclick=()=>{const hid=[...qa.querySelectorAll(".ans")].some(a=>!a.classList.contains("show"));
  qa.querySelectorAll(".ans").forEach(a=>{a.classList.toggle("show",hid);a.previousElementSibling.textContent=hid?"উত্তর লুকাও":"উত্তর দেখো"});$("all").textContent=hid?"সব উত্তর লুকাও":"সব উত্তর দেখাও"};
 app.insertAdjacentHTML("beforeend",exams());scrollTo(0,0)}
function item(q,t){const num=`<span class="qn">${esc(q.n)}</span>`;
 const ans=txt=>`<button class="sh">উত্তর দেখো</button><div class="ans"><b>উত্তর:</b> ${esc(txt)}${q.e?`<br><i>${esc(q.e)}</i>`:""}</div>`;
 if(t==="mcq"){const ci=L.findIndex(l=>q.a.startsWith(l+")"));
  return`<div class="q">${num} ${esc(q.q)}<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-r="${i===ci?1:0}">${L[i]}) ${esc(o)}</button>`).join("")}</div></div>`}
 if(t==="match")return`<div class="q">${num} ${esc(q.q)} <b>…………</b>${ans(q.q+" "+q.a)}</div>`;
 return`<div class="q">${num} ${esc(q.q)}${ans(q.a)}</div>`}
open_();
</script></body></html>
