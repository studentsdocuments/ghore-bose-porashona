function fit(){const sh=$$("sheet"),cols=$$("cols"),c1=$$("c1"),c2=$$("c2");if(!sh)return;

  if(c1.scrollHeight<=c1.clientHeight+1&&c2.scrollHeight<=c2.clientHeight+1){sh.dataset.fs=f;return f}}
 sh.dataset.fs=4;return 4}
