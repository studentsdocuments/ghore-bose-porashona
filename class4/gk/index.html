<script>
/* ===== সেটিংস ===== */
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwmlMMbFpyvxdC5dsvwENxrM5hkLR5lL3xg_s6MpXaLPQ4rWkC7P_Rf9o00f3Zzk04/exec";   // hsc/real-এর মতোই একই Apps Script
const PAY={bKash:"01757803397"},FEE="";   // FEE: যেমন "৫০ টাকা" লিখলে দেখাবে
const CUR=1;                               // এখন যে প্রশ্নব্যাংক দিয়ে নতুন পরীক্ষা বানানো হবে (bank-v1.js)
const PFX="g4",SUBJ_ID="c4gk";         // কোডের শুরু: g4-1xxxxx
const YEAR=2026,EXAM_TIME="২ ঘণ্টা";
const SETS=["পদ্মা","মেঘনা","সুরমা","কর্ণফুলী","তিস্তা","পশুর","মধুমতী","কপোতাক্ষ","বুড়িগঙ্গা","শীতলক্ষ্যা","বিজয়","কেওক্রাডং","তাজিংডং","সাজেক","চিম্বুক"];
/* মানবণ্টন: c = উত্তর দিতে হবে কয়টি, show = প্রশ্নপত্রে কয়টি থাকবে, m = প্রতিটির নম্বর */
const SECS=[
 {n:1,t:"সাধারণ জ্ঞান — প্রশ্নগুলোর উত্তর লেখো।",show:12,c:10,m:2},
 {n:2,t:"কম্পিউটার — ছোট প্রশ্নের উত্তর দাও।",show:5,c:5,m:2},
 {n:3,t:"কম্পিউটার — বড় প্রশ্নের উত্তর দাও।",show:2,c:2,m:5},
 {n:4,t:"ড্রইং — অঙ্কন করো ও রং করো।",show:3,c:2,m:5}];
/* ================== */
const L=["ক","খ","গ","ঘ","ঙ"],bn=n=>String(n).replace(/\d/g,d=>"০১২৩৪৫৬৭৮৯"[d]);
const un=s=>String(s).replace(/[০-৯]/g,d=>"০১২৩৪৫৬৭৮৯".indexOf(d));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id),app=$("app");
const qp=new URLSearchParams(location.search);
const TOTAL=SECS.reduce((a,s)=>a+s.c*s.m,0);   // ৫০ হওয়ার কথা
let auth=null;try{auth=JSON.parse(localStorage.getItem("rx:auth"))}catch(e){}   // hsc/real-এর সাথে একই লগইন
const authQ=()=>auth?{email:auth.email,key:auth.key}:{};
const api=async(params,body)=>{const r=await fetch(SCRIPT_URL+(body?"":"?"+new URLSearchParams({...params,...authQ()})),body?{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({...body,...authQ()})}:{});return r.json()};
const logout=()=>{auth=null;try{localStorage.removeItem("rx:auth")}catch(e){}};
const hd=(t,p)=>`<div class="hd no-p"><h1>${t}</h1><p>${p||""}</p></div>`;
const busy=t=>app.innerHTML=`<div class="card c">${t}</div>`;

/* ===== প্রশ্ন বাছাই (কোড থেকেই একই প্রশ্নপত্র আবার তৈরি হয়) =====
   ⚠ build() বদলালে পুরোনো কোডের প্রশ্নপত্র বদলে যাবে — তাই বদলাতে হলে নতুন bank-vN.js + CUR বাড়ান। */
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(arr,r)=>{arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
function build(B,seed){
 const r=mul(seed),ex=B.excl||{},ids=[];
 const pick=(key,k,ok,n0)=>{const n=n0||B[key].length;let ix;
  for(let t=0;t<300;t++){ix=shuf([...Array(n).keys()],r).slice(0,k);
   if((ex[key]||[]).some(g=>g.filter(i=>ix.includes(i)).length>1))continue;if(ok&&!ok(ix))continue;return ix}
  return ix};
 const P={};
 /* সাধারণ জ্ঞান: ১২টি = বাংলাদেশের সম্পদ ৪ + পৃথিবীর বৃহত্তম ও ক্ষুদ্রতম ৪ + মানবদেহ ৪ */
 P.gk=[];[["res","a"],["world","w"],["body","h"]].forEach(([key,c])=>pick(key,4).forEach(i=>{ids.push(c+i);P.gk.push(B[key][i])}));
 /* কম্পিউটার: বড় ২টি আগে, তারপর ছোট ৫টি (বড়-র সাথে একই বিষয়ের ছোট প্রশ্ন বাদ) */
 const li=pick("long",2),bad=new Set();li.forEach(i=>(B.xl[i]||[]).forEach(j=>bad.add(j)));
 const si=pick("short",5,ix=>!ix.some(j=>bad.has(j)));
 P.cs=si.map(i=>{ids.push("s"+i);return B.short[i]});
 P.cl=li.map(i=>{ids.push("l"+i);return B.long[i]});
 P.dr=pick("drawing",3).map(i=>{ids.push("d"+i);return B.drawing[i]});
 P.ids=["v"+(B.v||1),...ids];
 return P;
}
const loadBank=v=>new Promise((ok,no)=>{if(window.BANKS&&BANKS[v]){BANKS[v].v=v;return ok(BANKS[v])}
 const s=document.createElement("script");s.src="bank-v"+v+".js";s.onload=()=>{if(BANKS[v]){BANKS[v].v=v;ok(BANKS[v])}else no(new Error("প্রশ্নব্যাংক পাওয়া যায়নি"))};
 s.onerror=()=>no(new Error("প্রশ্ন লোড হয়নি — ইন্টারনেট দেখে আবার চেষ্টা করো"));document.head.appendChild(s)});
/* কোড: g4-১৫২৩৪৫ (প্রথম অঙ্ক = প্রশ্নব্যাংকের সংস্করণ)। শুধু ৬ অঙ্ক বা বাংলা অঙ্ক দিলেও চলে */
function normCode(raw){const s=un(String(raw||"").trim().toLowerCase()).replace(/\s+/g,"");const m=s.match(/^(?:g4-?)?(\d{6})$/);
 if(!m)throw new Error("কোড ঠিক নয় — প্রশ্নপত্রে লেখা কোডটি (যেমন "+PFX+"-123456) আবার দেখো।");return{code:PFX+"-"+m[1],num:m[1]}}
const setName=num=>SETS[(parseInt(num)||0)%SETS.length];

/* ===== প্রশ্নপত্র ও সমাধানের HTML ===== */
const secHead=(s,note)=>`<div class="sec"><span class="mk">${bn(s.m)} × ${bn(s.c)} = ${bn(s.m*s.c)}</span>${bn(s.n)}নং — ${s.t}${note?` <small>${note}</small>`:""}</div>`;
const blank=`<span class="bl">……………………</span>`;
const stop=t=>/[।?!.]$/.test(t)?t:t+"।";
function head(code,num,title){return `<div class="top">কোড: ${esc(code)} &nbsp;•&nbsp; সেট: ${esc(setName(num))}</div>
 <div class="ph"><h2>ঘরে বসে পড়াশোনা</h2><h3>বার্ষিক পরীক্ষা — ${bn(YEAR)}</h3><div>৪র্থ শ্রেণি • বিষয়: সাধারণ জ্ঞান, কম্পিউটার ও ড্রইং${title?" • "+title:""}</div>
 ${title?"":`<div class="info"><span>সময়— ${EXAM_TIME}</span><span>পূর্ণমান— ${bn(TOTAL)}</span></div>`}</div>`}
/* ===== বুকলেট প্রশ্নপত্র (A4 landscape • ২ কলাম • মার্জিন ০.৫″ • ২ পাতা = ৪টি A5 পৃষ্ঠা) =====
   শিটের ক্রম: পাতা ১ = [৪র্থ পৃষ্ঠা | ১ম পৃষ্ঠা], পাতা ২ = [২য় পৃষ্ঠা | ৩য় পৃষ্ঠা] (Duplex করে ভাঁজ করলে ১-২-৩-৪)
   জায়গা না কুলালে ক্রমে: ফাঁকা লাইন কমে → হেডার/ফুটার ছোট → লেখা ১২ → ১১ → ১০ পয়েন্ট (১০-এর নিচে নয়) */
const BK={pw:297,ph:210,m:12.7,gap:10},LH=1.3;BK.cw=(BK.pw-2*BK.m-BK.gap)/2;BK.ch=BK.ph-2*BK.m;
const BCFG=[{fs:12,gap:1,hs:0},{fs:12,gap:.5,hs:0},{fs:12,gap:0,hs:0},{fs:12,gap:0,hs:1},{fs:11,gap:0,hs:1},{fs:10,gap:0,hs:1}];
const mline=s=>`<div class="ml">${bn(s.m)} × ${bn(s.c)} = ${bn(s.m*s.c)}</div>`;
const bsec=(s,note)=>`<div class="bsec">${bn(s.n)}নং — ${s.t}${note?" "+note:""}</div>`;
/* MCQ-র অপশন এক অনুচ্ছেদে পাশাপাশি (ক) … খ) … গ) … ঘ) …) — ছোট অপশন ভাঙে না, লাইন বাঁচে */
const optLine=q=>[0,1,2,3].map(k=>`${L[k]})\u00A0${q.o[k].length<=22?q.o[k].replace(/ /g,"\u00A0"):q.o[k]}`).join("\u00A0\u00A0 ");
const items=(arr,f)=>arr.map((x,i)=>`<div class="q"><b>${bn(i+1)}।</b> ${f(x)}</div>`).join("");
const NOTE=n=>{const s=SECS[n-1];return s.show>s.c?"— যেকোনো "+bn(s.c)+"টির উত্তর দাও।":""};
const formBox=(f,filled)=>`<div class="fbox">${(f.h||[]).map(x=>`<div class="fh">${esc(x)}</div>`).join("")}${f.f.map((r,i)=>`<span class="fr">${bn(i+1)}। ${esc(r[0])} : ${filled?`<span class="fv">${esc(r[1])}</span>`:"…………………………"}</span>`).join("")}${f.sg?`<div class="fs">${filled&&f.sv?`<span class="fv">${esc(f.sv)}</span><br>`:""}${esc(f.sg)}</div>`:""}</div>`;
function secBlocks(P){
 const S=n=>SECS[n-1],A=[],add=(n,arr,f)=>arr.forEach((x,i)=>{const ti=i===0,ml=i===arr.length-1;
  A.push({k:"it",n,i,ti,ml,h:`<div class="${ml?"blk":"at"}">${ti?bsec(S(n),NOTE(n)):""}<div class="q"><b>${bn(i+1)}।</b> ${f(x)}</div>${ml?mline(S(n)):""}</div>`})});
 add(1,P.gk,q=>esc(q.q));
 add(2,P.cs,q=>esc(q.q));
 add(3,P.cl,q=>esc(q.q));
 add(4,P.dr,w=>"অঙ্কন করো ও রং করো: "+esc(w));
 return A}
const headBlock=(code,num)=>({k:"head",h:`<div class="blk bhd"><div class="top">কোড: ${esc(code)} • সেট: ${esc(setName(num))}</div><div class="hc"><b>বার্ষিক পরীক্ষার পূর্ব প্রস্তুতি-${bn(YEAR)}</b><br>শ্রেণি: ৪র্থ • বিষয়: সাধারণ জ্ঞান, কম্পিউটার ও ড্রইং</div><div class="info"><span>সময়— ${EXAM_TIME}</span><span>পূর্ণমান— ${bn(TOTAL)}</span></div><div>নির্দেশনা: সবগুলো প্রশ্নের উত্তর খাতায় লেখো।</div></div>`});
const footBlock=code=>({k:"foot",h:`<div class="blk bft">কোড: ${esc(code)} • OMR ফ্রি: ওয়েবসাইটে এই কোড দিয়ে উত্তর মেলাও</div>`});
const range=(a,b)=>Array.from({length:Math.max(0,b-a)},(_,i)=>a+i);
/* all = [হেডার, ১নং…৬নং, ফুটার]; ৬টি প্রশ্ন ৪টি কলামে ক্রমানুসারে ভাগ (কোনো প্রশ্ন ভাঙে না) */
function bkPart(h,cap){   // ক্রমানুসারে ভরাট: একটি কলাম ভরলে তবেই পরেরটি; ৪টি কলামে না কুলালে null
 const g=[[],[],[],[]],ld=[0,0,0,0];let c=0,ok=true;
 h.forEach((x,i)=>{if(ld[c]+x>cap&&g[c].length&&c<3)c++;if(ld[c]+x>cap)ok=false;g[c].push(i);ld[c]+=x});
 return{g,ld,mx:Math.max(...ld),over:!ok}}
function bkCands(code,num,P){
 const all=[headBlock(code,num),...secBlocks(P),footBlock(code)];const AH=all.map(x=>x.h);
 const mm=document.createElement("div");mm.className="bk";mm.style.cssText=`position:absolute;left:-9999px;top:0;width:${BK.cw}mm;visibility:hidden`;document.body.appendChild(mm);
 const cap=(BK.ch/25.4*96-24)*0.97,ok=[];let last=null;
 for(const cfg of BCFG){
  mm.style.setProperty("--fs",cfg.fs+"pt");mm.style.setProperty("--gap",cfg.gap*LH+"em");mm.classList.toggle("hs",!!cfg.hs);
  const h=AH.map(b=>{mm.innerHTML=b;return mm.firstElementChild.getBoundingClientRect().height});
  const p=bkPart(h,cap);if(!p)continue;last={cfg,groups:p.g,loads:p.ld.map(x=>x/(BK.ch/25.4*96)),over:true};
  if(!p.over)ok.push({cfg,groups:p.g,loads:p.ld.map(x=>x/(BK.ch/25.4*96)),over:false})}
 mm.remove();return{all,ok,last}}
const bkStyle=c=>`--fs:${c.cfg.fs}pt;--gap:${c.cfg.gap*LH}em`;
function bkHTML(all,c){const col=(g,n)=>`<div class="bcol"><div class="bc">${g.map(i=>all[i].h).join("")}</div><div class="pn">পৃষ্ঠা ${bn(n)}</div></div>`,G=c.groups;
 return`<div id="bkw" class="bk ${c.cfg.hs?"hs":""}" style="${bkStyle(c)}"><div class="cap no-p">📄 পাতা ১ (সামনে): [৪র্থ পৃষ্ঠা | ১ম পৃষ্ঠা]</div><div class="bsheet">${col(G[3],4)}${col(G[0],1)}</div><div class="cap no-p">📄 পাতা ২ (পেছনে): [২য় পৃষ্ঠা | ৩য় পৃষ্ঠা]</div><div class="bsheet">${col(G[1],2)}${col(G[2],3)}</div></div>`}
function bkZoom(){const o=$("bko"),w=$("bkw");if(!o||!w)return;const W=BK.pw/25.4*96,s=Math.min(1,(o.parentElement.clientWidth-4)/W);w.style.transform=`scale(${s})`;o.style.width=W*s+"px";o.style.height=w.offsetHeight*s+"px"}
addEventListener("resize",bkZoom);
const ansBlock=a=>`<div class="ab">${a.map(([k,t])=>`<p class="${k}">${k==="li"?"• ":""}${esc(t)}</p>`).join("")}</div>`;
function solHTML(code,num,P){
 const S=n=>SECS[n-1],qa=(i,q,a)=>`<div class="q"><b>${bn(i+1)}।</b> ${esc(q)}<div class="ab"><p><span class="ans">${esc(a)}</span></p></div></div>`;
 return head(code,num,"সমাধান ও উত্তরমালা")+secHead(S(1),NOTE(1))+P.gk.map((x,i)=>qa(i,x.q,x.a)).join("")
  +secHead(S(2),NOTE(2))+P.cs.map((x,i)=>qa(i,x.q,x.a)).join("")
  +secHead(S(3),NOTE(3))+P.cl.map((x,i)=>`<div class="q"><b>${bn(i+1)}।</b> ${esc(x.q)}${ansBlock(x.a)}</div>`).join("")
  +secHead(S(4),NOTE(4))+P.dr.map((w,i)=>`<div class="q"><b>${bn(i+1)}।</b> অঙ্কন করো ও রং করো: ${esc(w)}</div>`).join("")+`<div class="msg no-p">ছবির উত্তর এখানে দেওয়া হয়নি — নিজে এঁকে ও রং করে অনুশীলন করো।</div>`
  +`<div class="ft">কোড: ${esc(code)} • ঘরে বসে পড়াশোনা</div>`}

/* ছবি → PDF (নিজস্ব ছোট লেখক; কোনো বাড়তি লাইব্রেরি লাগে না)। প্রতিটি JPEG একটি পূর্ণ A4 landscape পাতা */
function jpegsToPdf(pages,W,H){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);len+=b.length};
 const obj=(n,body)=>{offs[n]=len;push(n+" 0 obj\n");push(body);push("\nendobj\n")};
 const n=pages.length;push("%PDF-1.4\n");
 obj(1,"<</Type/Catalog/Pages 2 0 R>>");obj(2,"<</Type/Pages/Kids["+pages.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"]/Count "+n+">>");
 pages.forEach((p,i)=>{const pg=3+3*i,ct=pg+1,im=pg+2,cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(pg,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im0 ${im} 0 R>>>>/Contents ${ct} 0 R>>`);
  obj(ct,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  offs[im]=len;push(`${im} 0 obj\n<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${p.data.length}>>\nstream\n`);push(p.data);push("\nendstream\nendobj\n")});
 const xr=len,tot=3*n+3;push("xref\n0 "+tot+"\n0000000000 65535 f \n");
 for(let i=1;i<tot;i++)push(String(offs[i]).padStart(10,"0")+" 00000 n \n");
 push(`trailer\n<</Size ${tot}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"})}
/* PDF: প্রতিটি শিট ব্রাউজারে (সঠিক বাংলা ফন্টসহ) ছবি করে A4 landscape PDF-এর ২ পাতায় বসানো — ফন্ট ভাঙে না */
async function dlPDF(code,lay){
 const btn=$("dp"),old=btn.textContent;btn.disabled=true;btn.textContent="PDF বানানো হচ্ছে…";let box=null;
 try{
  await lib(H2C,()=>window.html2canvas);await ensureFonts();
  const src=$("bkw");box=document.createElement("div");box.className=src.className;box.setAttribute("style",src.getAttribute("style")+";position:fixed;left:-10000px;top:0;width:297mm;transform:none");
  src.querySelectorAll(".bsheet").forEach(x=>{const c=x.cloneNode(true);c.style.border="0";c.style.margin="0";box.appendChild(c)});document.body.appendChild(box);
  const pages=[];
  for(const sh of box.querySelectorAll(".bsheet")){const cv=await window.html2canvas(sh,{scale:3,backgroundColor:"#ffffff",useCORS:true});
   const bl=await new Promise(r=>cv.toBlob(r,"image/jpeg",.96));pages.push({data:new Uint8Array(await bl.arrayBuffer()),w:cv.width,h:cv.height})}
  const blob=jpegsToPdf(pages,842,595),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=code+".pdf";document.body.appendChild(a);a.click();a.remove();
 }catch(e){alert("PDF হয়নি: "+(e.message||e))}
